<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="login" href="/ecommerce-frontend/src/styles/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
        <link rel="stylesheet" href="login.css">
    <title>Document</title>

    
</head>

<body>
    <div class="container px-4 text-center">
        <div class="row gx-5 mt-5">
            <div class="col">
                <div class="p-3 login1">
                    <p class="elegance">Elegance<br> Start here</p>
                    <svg xmlns="http://www.w3.org/2000/svg" width="180" height="26" viewBox="0 0 180 26" fill="none">
                        <path d="M2 23.6834C31.3333 14.0167 107.6 -3.4166 178 4.1834" stroke="white" stroke-width="4"
                            stroke-linecap="round" />
                    </svg>
                    <p class="Where">Where style meets simplicity. Enjoy your shopping experience.</p>

                    <div class="text-center">
                        <img class="loginimg img-fluid" src="../images/login.png" alt="Login Illustration">
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="p-3" style="align-content: center;">

                    <img class="loginlogo" src="../images/logo.png">
                    <p class="welcome">Welcome Back</p>
                    <p class="please">Please Login to Your account</p>
                    <!-- input username -->
                    <div class="input-group mb-3">
                        <input type="text" class="form-control custom-input" placeholder="Username"
                            aria-label="Username" aria-describedby="basic-addon1">
                    </div>
                    <!-- input password -->
                    <div class="input-group mb-3">
                        <input type="password" class="form-control custom-input" id="passwordInput"
                            placeholder="Password" aria-label="Password">
                    </div>
                    <div style="margin-top: -10px;">
                        <p class="loginforgot">Forgot Password?</p>
                    </div>
                    <!-- button -->
                    <div class="d-grid gap-2">
                        <button class="btn custom-btn" type="button">Button</button>
                    </div>
                    <hr style="border: none; height: 2px; background-color: #8d8c8c; width: 50%;">
                </div>
            </div>
        </div>
    </div>
    <!-- bootstrap link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
