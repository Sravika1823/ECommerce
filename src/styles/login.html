<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="login" href="/ecommerce-frontend/src/styles/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <title>Document</title>

    <style>
        .login1 {
            border-radius: 3.87069rem;
            background: linear-gradient(152deg, #E3902B 4.43%, #E1C31E 95.6%);
            box-shadow: 0px 3.303px 3.303px 0px rgba(0, 0, 0, 0.25);

            /* display: flex; */

            height: 46.625rem;
            padding: 4.3125rem 2.5625rem 0rem 2.5625rem;
            justify-content: center;
            align-items: flex-end;
            gap: 0.625rem;
        }

        .elegance {
            color: #FFF;
            font-family: 'Poppins', sans-serif;
            font-size: 3.35456rem;
            font-style: normal;
            font-weight: 600;
            text-align: left;
            padding: 5rem 0rem 0rem 5rem;
            line-height: 3.7rem;
            margin-bottom: 0px;
            /* 84.615% */
        }

        .Where {

            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-style: normal;
            font-weight: 320;
            line-height: normal;
            text-align: left;
            padding: 2rem 3rem 0rem 5rem;
        }

        .loginimg {
            width: 100%;
            max-width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            /* padding-top: 5.5rem; */
        }

        .logindev {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }
    </style>
</head>

<body>

    <div class="container px-4 text-center">
        <div class="row gx-5 mt-5">
            <div class="col">
                <div class="p-3 login1">
                    <div>
                        <p class="elegance">Elegance<br> Start here</p>
                        <svg xmlns="http://www.w3.org/2000/svg" width="180" height="26" viewBox="0 0 180 26"
                            fill="none">
                            <path d="M2 23.6834C31.3333 14.0167 107.6 -3.4166 178 4.1834" stroke="white"
                                stroke-width="4" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div>
                        <p class="Where">Where style meets simplicity. Enjoy your shopping experience.</p>

                        <div class="logindev">
                            <img class="loginimg" src="../images/login.png">
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="p-3" style="background-color: bisque;">Custom column padding</div>
                </div>
            </div>
        </div>

        <!-- bootstrap link -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
            crossorigin="anonymous"></script>
</body>

</html>
